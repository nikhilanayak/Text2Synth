[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctag-repro"
version = "0.3.0"
description = "Reference-compatible reproduction of CTAG text-to-synth programming"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Synthesizer2 contributors"}]
dependencies = [
  "numpy>=1.23,<3",
  "packaging>=24,<27",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
paper = [
  "chex==0.1.7",
  "evosax==0.1.5",
  "flax==0.7.1",
  "hydra-core==1.3.2",
  "hydra-ax-sweeper==1.2.0",
  "jax==0.4.14; sys_platform != 'darwin' or platform_machine != 'arm64'",
  "jaxlib==0.4.14; sys_platform != 'darwin' or platform_machine != 'arm64'",
  # 0.4.14 never published an Apple Silicon wheel. 0.4.18 is the oldest
  # available arm64 pair and remains compatible with Flax/SynthAX 0.7.1/0.2.1.
  "jax==0.4.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "jaxlib==0.4.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "laion-clap==1.1.4",
  "numba==0.57.0",
  "pandas==1.5.3",
  "soundfile==0.12.1",
  "synthax==0.2.1",
  "tensorboard==2.13.0",
  "torch==2.0.0",
  "torchvision==0.15.1",
  "tqdm==4.65.0",
  "transformers==4.27.2",
  "urllib3<2; sys_platform == 'darwin'",
]
colab = [
  "braceexpand==0.1.7",
  "chex==0.1.92",
  "evosax==0.3.1",
  "flax==0.12.9",
  "ftfy==6.3.1",
  "h5py>=3.12,<4",
  "librosa==0.11.0",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "pandas==2.2.3",
  "progressbar2>=4.5,<5",
  "scikit-learn==1.6.1",
  "scipy==1.16.3",
  "soundfile==0.14.0",
  "safetensors>=0.5,<1",
  "synthax==0.2.2",
  "torchlibrosa==0.1.0",
  "webdataset==1.0.2",
  "wget==3.2",
]
direct = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "safetensors>=0.5,<1",
  "torch>=2,<3",
]
dev = [
  "pytest>=7,<9",
  "pytest-cov>=4,<6",
]

[project.scripts]
ctag = "ctag_repro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: loads the 1.86 GB CLAP checkpoint and executes the real ML backend",
]
